<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Referral Redirect</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b1120;
            color: #e2e8f0;
        }
        .card {
            width: min(92vw, 560px);
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            text-align: center;
        }
        .meta {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 12px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Redirecting...</h1>
        <div class="meta" id="targetText">Preparing your referral destination...</div>
    </div>

    <script>
        (() => {
            function safeAbsoluteUrl(value) {
                if (!value) return null;
                try {
                    const raw = value.trim();
                    if (!raw) return null;
                    if (/^https?:\/\//i.test(raw)) return raw;
                    if (raw.startsWith('/')) return new URL(raw, window.location.origin).toString();
                    return new URL(raw, window.location.origin).toString();
                } catch (error) {
                    return null;
                }
            }

            const params = new URLSearchParams(window.location.search);
            const pathname = window.location.pathname;

            let code = params.get('r') || params.get('ref') || params.get('code') || params.get('id');
            if (!code) {
                const segments = pathname.split('/').filter(Boolean);
                if (segments[0] === 'ref' || segments[0] === 'r') {
                    code = segments[1] || '';
                }
            }

            let target =
                params.get('target') ||
                params.get('redirect') ||
                params.get('to') ||
                params.get('url') ||
                params.get('next') ||
                params.get('destination');

            if (!target && code) {
                target = sessionStorage.getItem('ref-target-' + code) || sessionStorage.getItem('ref_target_' + code);
            }

            if (!target) {
                let fallbackPath = '/';
                if (pathname.startsWith('/ref/') || pathname.startsWith('/r/')) {
                    fallbackPath = '/';
                }
                if (fallbackPath === '/' && pathname && pathname !== '/' && !pathname.startsWith('/ref') && !pathname.startsWith('/r')) {
                    fallbackPath = pathname;
                }
                target = new URL(fallbackPath, window.location.origin).toString();
            }

            const resolvedTarget = safeAbsoluteUrl(target);
            const output = document.getElementById('targetText');
            if (resolvedTarget) {
                output.textContent = resolvedTarget;
                window.location.replace(resolvedTarget);
            } else {
                output.textContent = 'No valid referral destination found. Redirecting to the homepage.';
                window.location.replace(window.location.origin + '/');
            }
        })();
    </script>
</body>
</html>
